<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1080" width="1160" height="1080" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5100" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF5100" stop-opacity="0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5100"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1160" height="1080" fill="#0d1117"/>

  <!-- Title -->
  <text x="60" y="72" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="0.5">Az MCP a gyakorlatban</text>
  <text x="60" y="106" fill="#8b949e" font-size="18">Hogyan kerül az AI és a céges rendszer közé — egy szerződésadatbázis példáján</text>
  <line x1="60" y1="130" x2="1100" y2="130" stroke="#ff5100" stroke-width="2" opacity="0.5"/>

  <!-- ===== THREE PANELS ===== -->
  <!-- Left : AI -->
  <rect x="60" y="170" width="310" height="250" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="170" width="310" height="6" rx="3" fill="#FF5100"/>
  <text x="84" y="212" fill="#8b949e" font-size="12.5" font-weight="700" letter-spacing="1.4">1 · AZ AI OLDALA</text>
  <text x="84" y="248" fill="#ffffff" font-size="21" font-weight="700">AI asszisztens / ügynök</text>
  <text x="84" y="288" fill="#c9d1d9" font-size="15">Claude · ChatGPT · Copilot</text>
  <text x="84" y="310" fill="#c9d1d9" font-size="15">saját belső ügynök</text>
  <rect x="84" y="334" width="262" height="64" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="98" y="358" fill="#FF5100" font-size="13" font-weight="700">Ide be kell állítani:</text>
  <text x="98" y="379" fill="#c9d1d9" font-size="13">az AI nem tudja magától,</text>
  <text x="98" y="395" fill="#c9d1d9" font-size="13">hogy létezik az MCP-szerver.</text>

  <!-- Middle : MCP -->
  <rect x="425" y="160" width="310" height="270" rx="14" fill="url(#glow)" stroke="#FF5100" stroke-width="2"/>
  <rect x="425" y="160" width="310" height="6" rx="3" fill="#FF5100"/>
  <text x="449" y="204" fill="#FF5100" font-size="12.5" font-weight="700" letter-spacing="1.4">2 · A KÖZÉPSŐ RÉTEG</text>
  <text x="449" y="242" fill="#ffffff" font-size="24" font-weight="800">MCP-szerver</text>
  <text x="449" y="278" fill="#c9d1d9" font-size="14.5">felfelé: szabványos nyelv</text>
  <text x="449" y="300" fill="#c9d1d9" font-size="14.5">lefelé: egyedi híd</text>
  <rect x="449" y="322" width="262" height="52" rx="8" fill="#0d1117" stroke="#FF5100" opacity="0.8"/>
  <text x="463" y="346" fill="#FF5100" font-size="13" font-weight="700">Ez a te programod</text>
  <text x="463" y="365" fill="#c9d1d9" font-size="13">= a tool-lista helye</text>
  <text x="449" y="402" fill="#8b949e" font-size="12.5" font-style="italic">a meglévő rendszer MELLÉ kerül,</text>
  <text x="449" y="418" fill="#8b949e" font-size="12.5" font-style="italic">nem a belsejébe.</text>

  <!-- Right : Company -->
  <rect x="790" y="170" width="310" height="250" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="790" y="170" width="310" height="6" rx="3" fill="#FF5100"/>
  <text x="814" y="212" fill="#8b949e" font-size="12.5" font-weight="700" letter-spacing="1.4">3 · A CÉGES VALÓSÁG</text>
  <text x="814" y="248" fill="#ffffff" font-size="21" font-weight="700">Adatbázis · frontend</text>
  <text x="814" y="288" fill="#c9d1d9" font-size="15">Postgres · MySQL · Supabase</text>
  <text x="814" y="310" fill="#c9d1d9" font-size="15">weboldal · fotótár</text>
  <rect x="814" y="334" width="262" height="64" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="828" y="358" fill="#3fb950" font-size="13" font-weight="700">Itt nem kell átépíteni semmit:</text>
  <text x="828" y="379" fill="#c9d1d9" font-size="13">ugyanazt az adatot kérdezi,</text>
  <text x="828" y="395" fill="#c9d1d9" font-size="13">amit az emberek is használnak.</text>

  <!-- Arrows between panels -->
  <line x1="374" y1="255" x2="421" y2="255" stroke="#FF5100" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="739" y1="255" x2="786" y2="255" stroke="#FF5100" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="397" y="243" fill="#8b949e" font-size="11.5" text-anchor="middle">kérés /</text>
  <text x="397" y="275" fill="#8b949e" font-size="11.5" text-anchor="middle">eredmény</text>
  <text x="762" y="243" fill="#8b949e" font-size="11.5" text-anchor="middle">kérés /</text>
  <text x="762" y="275" fill="#8b949e" font-size="11.5" text-anchor="middle">eredmény</text>

  <!-- ===== TOOL LIST CARD ===== -->
  <rect x="60" y="470" width="1040" height="430" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="470" width="6" height="430" rx="3" fill="#FF5100"/>

  <text x="92" y="512" fill="#ffffff" font-size="21" font-weight="800">A tool-lista — amit az AI egyáltalán kérhet</text>
  <text x="92" y="538" fill="#8b949e" font-size="14">Nem szabad csatorna: az MCP-szerver előre meghirdeti, milyen műveleteket tud elvégezni — az AI csak ezekből választhat.</text>

  <!-- Left column: DB -->
  <text x="92" y="582" fill="#FF5100" font-size="13" font-weight="700" letter-spacing="1">1. PÉLDA · ADATBÁZIS (szerződések)</text>
  <rect x="92" y="596" width="470" height="272" rx="10" fill="#0d1117" stroke="#30363d"/>

  <text x="112" y="626" fill="#3fb950" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">kereses_szerzodesre</text>
  <text x="112" y="646" fill="#8b949e" font-size="12.5">Keresés ügyfél, dátum vagy státusz szerint</text>
  <text x="500" y="640" fill="#3fb950" font-size="11.5" font-weight="700" text-anchor="end">CSAK OLVAS</text>
  <line x1="112" y1="662" x2="542" y2="662" stroke="#21262d"/>

  <text x="112" y="690" fill="#3fb950" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">szerzodes_reszletei</text>
  <text x="112" y="710" fill="#8b949e" font-size="12.5">Egy szerződés teljes szövege és metaadatai</text>
  <text x="500" y="704" fill="#3fb950" font-size="11.5" font-weight="700" text-anchor="end">CSAK OLVAS</text>
  <line x1="112" y1="726" x2="542" y2="726" stroke="#21262d"/>

  <text x="112" y="754" fill="#d29922" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">statusz_modositas</text>
  <text x="112" y="774" fill="#8b949e" font-size="12.5">Szerződés állapotának átírása</text>
  <text x="500" y="768" fill="#d29922" font-size="11.5" font-weight="700" text-anchor="end">ÍRÁS · JÓVÁHAGYÁSSAL</text>
  <line x1="112" y1="790" x2="542" y2="790" stroke="#21262d"/>

  <text x="112" y="818" fill="#f85149" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">nyers_sql</text>
  <text x="112" y="838" fill="#8b949e" font-size="12.5">⚠ Ha felveszed, az egész adatbázist megnyitod</text>
  <text x="500" y="832" fill="#f85149" font-size="11.5" font-weight="700" text-anchor="end">NEM JAVASOLT</text>

  <!-- Right column: Web -->
  <text x="598" y="582" fill="#FF5100" font-size="13" font-weight="700" letter-spacing="1">2. PÉLDA · WEBOLDAL (referencialista + fotótár)</text>
  <rect x="598" y="596" width="470" height="272" rx="10" fill="#0d1117" stroke="#30363d"/>

  <text x="618" y="626" fill="#3fb950" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">projekt_lista</text>
  <text x="618" y="646" fill="#8b949e" font-size="12.5">Referencialisták olvasása</text>
  <text x="1006" y="640" fill="#3fb950" font-size="11.5" font-weight="700" text-anchor="end">CSAK OLVAS</text>
  <line x1="618" y1="662" x2="1048" y2="662" stroke="#21262d"/>

  <text x="618" y="690" fill="#d29922" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">projekt_hozzaadas</text>
  <text x="618" y="710" fill="#8b949e" font-size="12.5">Új projekt: cím, leírás, év, fotók kellenek</text>
  <text x="1006" y="704" fill="#d29922" font-size="11.5" font-weight="700" text-anchor="end">ADATOT VÁR</text>
  <line x1="618" y1="726" x2="1048" y2="726" stroke="#21262d"/>

  <text x="618" y="754" fill="#d29922" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">foto_csere</text>
  <text x="618" y="774" fill="#8b949e" font-size="12.5">Fotó cseréje: projekt_id + kép kell</text>
  <text x="1006" y="768" fill="#d29922" font-size="11.5" font-weight="700" text-anchor="end">ADATOT VÁR</text>
  <line x1="618" y1="790" x2="1048" y2="790" stroke="#21262d"/>

  <text x="618" y="818" fill="#f85149" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">foto_torles</text>
  <text x="618" y="838" fill="#8b949e" font-size="12.5">⚠ Csak megerősítéssel, naplózva</text>
  <text x="1006" y="832" fill="#f85149" font-size="11.5" font-weight="700" text-anchor="end">VESZÉLYES</text>

  <!-- Bottom message -->
  <rect x="60" y="930" width="1040" height="94" rx="14" fill="url(#glow)" stroke="#FF5100" stroke-width="1.5"/>
  <text x="580" y="972" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Nem az AI dönti el, mihez nyúlhat —</text>
  <text x="580" y="1002" fill="#FF5100" font-size="19" font-weight="700" text-anchor="middle">hanem a tool-lista, amelyet a cég állít össze.</text>

</svg>
